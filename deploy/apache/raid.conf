# Apache reverse proxy for RAID — sprintraid.uk
#
# Enable required modules first:
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#
# RAID has no WebSockets — plain HTTP reverse proxy is sufficient.
# Apache terminates TLS and applies edge headers; the Node app binds to
# 127.0.0.1:3003 (only reachable from this box).

<VirtualHost *:80>
    ServerName sprintraid.uk
    ServerAlias www.sprintraid.uk

    # After certbot is run for sprintraid.uk, uncomment these two lines to
    # redirect all plain HTTP to HTTPS. Leave them commented during the
    # initial certbot challenge.
    # RewriteEngine On
    # RewriteRule ^/?(.*) https://sprintraid.uk/$1 [R=301,L]

    ProxyPreserveHost On
    ProxyRequests Off

    # mod_proxy_http auto-sets X-Forwarded-For and X-Forwarded-Host.
    # X-Forwarded-Proto is not, so we set it explicitly — server.js relies on
    # process.env.NODE_ENV (not this header) to mark cookies Secure, but
    # setting the header keeps the app trust-proxy aware of the real scheme.
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:3003/
    ProxyPassReverse / http://127.0.0.1:3003/

    # /extract POSTs are capped at 1MB by express.json — match here.
    LimitRequestBody 1048576

    ErrorLog  ${APACHE_LOG_DIR}/raid-error.log
    CustomLog ${APACHE_LOG_DIR}/raid-access.log combined
</VirtualHost>

# ----------------------------------------------------------------------------
# HTTPS vhost — uncomment after certbot has issued the certificate.
# Run once with the HTTP vhost above unchanged:
#   sudo certbot --apache -d sprintraid.uk -d www.sprintraid.uk
# certbot will auto-rewrite this file or generate a sibling. If you prefer to
# manage it manually, uncomment the block below and reload Apache.
# ----------------------------------------------------------------------------

