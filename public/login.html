<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAID — Sign in</title>
  <meta name="description" content="Sign in to RAID.">

  <link rel="stylesheet" href="/css/theme-core.css">
  <link rel="stylesheet" href="/css/theme-raid.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/breathing-waves.css">

  <script src="/js/breathing-waves.js" defer></script>
  <script src="/js/login.js" defer></script>
</head>
<body class="login-body">

  <header class="header-band" data-breathing-waves data-wave-palette="raid">
    <canvas></canvas>
  </header>

  <main class="login-page">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-card__brand">
        <svg class="hero__glyph" aria-hidden="true"><use href="/illos/theme-illos.svg#sticker-circle"/></svg>
        <span class="hero__kicker">RAID extraction</span>
      </div>
      <h1 id="login-heading" class="login-card__title">Sign in</h1>
      <p class="login-card__tagline">Enter your access key to continue.</p>

      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <label class="visually-hidden" for="key-input">Access key</label>
        <input
          id="key-input"
          class="login-input"
          type="password"
          placeholder="Access key"
          autocomplete="current-password"
          spellcheck="false"
          required>
        <button id="login-submit" class="btn btn--primary" type="submit">Sign in</button>
        <p id="login-error" class="login-error" role="alert" hidden></p>
      </form>
    </section>
  </main>

  <footer class="app-footer">
    <p>Part of the suite: <a href="https://sprintpoker.uk">sprintpoker</a> · <a href="https://sprintretro.uk">sprintretro</a> · <a href="https://signal.uk">signal</a></p>
    <p><small>Built with Claude. <a href="/license.html">License</a></small></p>
  </footer>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

</body>
</html>
